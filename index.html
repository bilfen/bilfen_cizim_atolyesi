<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bilfen Çizim Atölyesi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');
        
        body { 
            touch-action: none; 
            font-family: 'Quicksand', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        
        canvas { 
            touch-action: none; 
            cursor: crosshair; 
            image-rendering: auto;
        }
        
        .tool-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .tool-btn.active { 
            background-color: #fce7f3; 
            border-color: #ec4899; 
            transform: scale(1.1);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%;
            background: #ec4899; cursor: pointer; margin-top: -7px; border: 2px solid white;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px; cursor: pointer; background: #fbcfe8; border-radius: 3px;
        }

        .loading-container {
            width: 250px; height: 14px; background-color: #fce7f3;
            border-radius: 999px; overflow: hidden; position: relative;
        }
        .loading-bar {
            height: 100%; background: linear-gradient(90deg, #ec4899, #a855f7);
            width: 0%; transition: width 0.3s ease;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }
        .animate-float { animation: float 3s infinite ease-in-out; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #fdf2f8; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 10px; }
    </style>
</head>
<body class="bg-pink-50 h-screen overflow-hidden flex flex-col">

    <!-- ANA SAYFA -->
    <div id="home-page" class="flex flex-col h-full w-full transition-opacity duration-500">
        <div class="bg-white py-4 px-6 shadow-sm z-20 flex justify-center items-center border-b-4 border-pink-100 h-24 md:h-32">
            <img src="https://drive.google.com/thumbnail?id=1Juy34CkGmM9jU7tXy7Axq70bNmyChxG5&sz=w1000" alt="Logo" class="h-full object-contain drop-shadow-sm">
        </div>
        
        <div class="flex-grow flex flex-col items-center justify-center text-center p-6">
            <div class="relative mb-8">
                <div class="absolute inset-0 bg-pink-200 blur-3xl opacity-30 rounded-full"></div>
                <img src="https://drive.google.com/thumbnail?id=1MFFuXd6_8fKzyXu-hDbpe12SL-FUqSLp&sz=w800" alt="Ro-bi" class="w-64 h-64 md:w-96 md:h-96 object-contain animate-float relative z-10">
            </div>
            <h1 class="text-4xl md:text-6xl font-bold text-pink-600 mb-4 tracking-tight">Çizim Atölyesi</h1>
            <p class="text-pink-400 text-lg md:text-xl mb-10 max-w-md">Hayalindeki karakteri çiz, yapay zeka onu gerçeğe dönüştürsün!</p>
            <button onclick="showDrawingPage()" class="group relative px-12 py-5 bg-pink-500 text-white rounded-full font-bold text-2xl shadow-2xl hover:bg-pink-600 transition-all hover:scale-105 active:scale-95 flex items-center gap-4">
                <span>🎨 Başla</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                </svg>
            </button>
        </div>
    </div>

    <!-- ÇİZİM SAYFASI -->
    <div id="drawing-page" class="hidden flex-col h-full w-full">
        <!-- Üst Panel -->
        <header class="bg-white px-4 md:px-8 py-3 shadow-sm border-b-2 border-pink-100 flex items-center justify-between gap-4 h-20">
            <img src="https://drive.google.com/thumbnail?id=1Juy34CkGmM9jU7tXy7Axq70bNmyChxG5&sz=w1000" onclick="showHomePage()" class="h-10 cursor-pointer hover:opacity-80 transition-opacity hidden md:block">
            
            <div class="flex items-center gap-2 md:gap-4 flex-grow md:flex-grow-0">
                <div class="relative flex-grow min-w-[140px]">
                    <select id="template-select" class="w-full bg-pink-50 border-2 border-pink-200 text-pink-700 py-2 pl-3 pr-8 rounded-xl font-semibold appearance-none focus:outline-none focus:border-pink-400 cursor-pointer text-sm md:text-base" onchange="applyTemplate(this.value)">
                        <option value="">✨ Şablon Seç...</option>
                        <option value="rabbit">🐰 Tavşan</option>
                        <option value="cat">🐱 Kedi</option>
                        <option value="dog">🐶 Köpek</option>
                        <option value="robot">🤖 Robot</option>
                        <option value="fish">🐟 Balık</option>
                        <option value="rocket">🚀 Roket</option>
                        <option value="flower">🌻 Çiçek</option>
                    </select>
                    <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-pink-400">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
                    </div>
                </div>

                <button onclick="transformWithAI()" class="bg-gradient-to-r from-pink-500 to-purple-500 hover:from-pink-600 hover:to-purple-600 text-white font-bold py-2 px-4 md:px-6 rounded-xl shadow-lg transition-all active:scale-95 flex items-center gap-2 text-sm md:text-base">
                    <span>✨ Dönüştür</span>
                </button>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="downloadCanvas()" class="p-2 bg-blue-50 text-blue-600 rounded-xl hover:bg-blue-100 transition-colors" title="İndir">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                </button>
                <button onclick="showHomePage()" class="p-2 bg-gray-50 text-gray-600 rounded-xl hover:bg-gray-100 md:hidden" title="Kapat">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
        </header>

        <div class="flex-grow flex flex-col md:flex-row overflow-hidden p-2 md:p-4 gap-4">
            <!-- Araç Çubuğu -->
            <aside class="bg-white p-4 rounded-3xl shadow-sm border border-pink-100 flex md:flex-col items-center justify-between md:justify-start gap-6 w-full md:w-20 lg:w-64 flex-shrink-0 order-2 md:order-1">
                <div class="grid grid-cols-4 md:grid-cols-2 lg:grid-cols-2 gap-2 w-full">
                    <button id="tool-pen" onclick="setTool('pen')" class="tool-btn active aspect-square flex items-center justify-center rounded-2xl border-2 border-transparent text-2xl" title="Kalem">✏️</button>
                    <button id="tool-brush" onclick="setTool('brush')" class="tool-btn aspect-square flex items-center justify-center rounded-2xl border-2 border-transparent text-2xl" title="Fırça">🖌️</button>
                    <button id="tool-eraser" onclick="setTool('eraser')" class="tool-btn aspect-square flex items-center justify-center rounded-2xl border-2 border-transparent text-2xl" title="Silgi">🧽</button>
                    <button id="tool-fill" onclick="setTool('fill')" class="tool-btn aspect-square flex items-center justify-center rounded-2xl border-2 border-transparent text-2xl" title="Doldur">🪣</button>
                </div>

                <div class="hidden lg:flex flex-col gap-6 w-full">
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-pink-400 uppercase tracking-wider">Renk</label>
                        <div class="grid grid-cols-5 gap-1">
                            <button onclick="setColor('#000000')" class="w-6 h-6 rounded-full bg-black border border-gray-200"></button>
                            <button onclick="setColor('#ef4444')" class="w-6 h-6 rounded-full bg-red-500 border border-gray-200"></button>
                            <button onclick="setColor('#3b82f6')" class="w-6 h-6 rounded-full bg-blue-500 border border-gray-200"></button>
                            <button onclick="setColor('#10b981')" class="w-6 h-6 rounded-full bg-green-500 border border-gray-200"></button>
                            <input type="color" id="color-input" class="w-6 h-6 rounded-full overflow-hidden cursor-pointer p-0 border-0" oninput="setColor(this.value)">
                        </div>
                    </div>

                    <div class="space-y-3">
                        <div class="flex justify-between">
                            <label class="text-xs font-bold text-pink-400 uppercase tracking-wider">Kalınlık</label>
                            <span id="size-val" class="text-xs font-bold text-pink-600">5px</span>
                        </div>
                        <input type="range" id="size-slider" min="1" max="50" value="5" class="w-full" oninput="updateBrushSize(this.value)">
                    </div>
                </div>

                <div class="flex md:flex-col lg:flex-row gap-2 mt-auto">
                    <button onclick="undo()" class="p-3 bg-gray-50 rounded-2xl hover:bg-gray-100 text-xl" title="Geri">↩️</button>
                    <button onclick="redo()" class="p-3 bg-gray-50 rounded-2xl hover:bg-gray-100 text-xl" title="İleri">↪️</button>
                    <button onclick="clearCanvasPrompt()" class="p-3 bg-red-50 text-red-500 rounded-2xl hover:bg-red-100 text-xl" title="Temizle">🗑️</button>
                </div>
            </aside>

            <!-- Tuval Alanı -->
            <main class="flex-grow relative bg-white rounded-3xl shadow-2xl overflow-hidden border-4 border-white order-1 md:order-2" id="canvas-container">
                <canvas id="main-canvas" class="w-full h-full"></canvas>
                
                <!-- Yükleniyor Overlay -->
                <div id="ai-overlay" class="absolute inset-0 bg-white/95 backdrop-blur-sm z-50 hidden flex-col items-center justify-center p-8 text-center">
                    <img src="https://drive.google.com/thumbnail?id=114MpGMQyDUk0JlIx89MdLVIgQgnCpdt4&sz=w500" class="w-48 h-48 mb-6 animate-float">
                    <div class="loading-container mb-4">
                        <div id="ai-progress" class="loading-bar"></div>
                    </div>
                    <h3 id="ai-status" class="text-2xl font-bold text-pink-600 mb-2">RO-Bi bakıyor...</h3>
                    <p id="ai-subtext" class="text-pink-400 max-w-xs">Çizimini inceliyorum ve hayal gücümü kullanıyorum!</p>
                </div>
            </main>
        </div>
    </div>

    <script>
        // Yapılandırma
        const apiKey = "";
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const container = document.getElementById('canvas-container');
        
        let state = {
            tool: 'pen',
            color: '#000000',
            size: 5,
            isDrawing: false,
            lastX: 0,
            lastY: 0,
            undoStack: [],
            redoStack: [],
            historyLimit: 20
        };

        // Başlatma
        function init() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // Mouse Olayları
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);

            // Dokunmatik Olaylar
            canvas.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                startDrawing(touch);
                e.preventDefault();
            }, { passive: false });
            
            canvas.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                draw(touch);
                e.preventDefault();
            }, { passive: false });
            
            canvas.addEventListener('touchend', stopDrawing);

            // İlk hali kaydet
            saveState();
        }

        function resizeCanvas() {
            const tempImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.putImageData(tempImage, 0, 0);
        }

        // Çizim Mantığı
        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX || e.pageX) - rect.left,
                y: (e.clientY || e.pageY) - rect.top
            };
        }

        function startDrawing(e) {
            const coords = getCoords(e);
            state.isDrawing = true;
            [state.lastX, state.lastY] = [coords.x, coords.y];

            if (state.tool === 'fill') {
                floodFill(Math.floor(coords.x), Math.floor(coords.y), state.color);
                saveState();
                state.isDrawing = false;
            }
        }

        function draw(e) {
            if (!state.isDrawing) return;
            const coords = getCoords(e);

            ctx.beginPath();
            ctx.strokeStyle = state.tool === 'eraser' ? '#ffffff' : state.color;
            ctx.lineWidth = state.size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (state.tool === 'brush') {
                ctx.globalAlpha = 0.4;
                ctx.shadowBlur = state.size / 2;
                ctx.shadowColor = state.color;
            } else {
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }

            ctx.moveTo(state.lastX, state.lastY);
            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();

            [state.lastX, state.lastY] = [coords.x, coords.y];
        }

        function stopDrawing() {
            if (state.isDrawing) {
                state.isDrawing = false;
                saveState();
            }
        }

        // Araçlar
        function setTool(tool) {
            state.tool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tool-${tool}`).classList.add('active');
        }

        function setColor(color) {
            state.color = color;
            document.getElementById('color-input').value = color;
        }

        function updateBrushSize(val) {
            state.size = parseInt(val);
            document.getElementById('size-val').innerText = `${val}px`;
        }

        // Flood Fill (Optimized)
        function floodFill(startX, startY, fillColor) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const targetColor = getPixelColor(data, startX, startY);
            const fillRGB = hexToRgb(fillColor);

            if (colorsMatch(targetColor, fillRGB)) return;

            const pixelsToCheck = [startX, startY];
            while (pixelsToCheck.length > 0) {
                const y = pixelsToCheck.pop();
                const x = pixelsToCheck.pop();

                const index = (y * canvas.width + x) * 4;
                if (colorsMatch(getPixelColor(data, x, y), targetColor)) {
                    data[index] = fillRGB.r;
                    data[index + 1] = fillRGB.g;
                    data[index + 2] = fillRGB.b;
                    data[index + 3] = 255;

                    if (x > 0) pixelsToCheck.push(x - 1, y);
                    if (x < canvas.width - 1) pixelsToCheck.push(x + 1, y);
                    if (y > 0) pixelsToCheck.push(x, y - 1);
                    if (y < canvas.height - 1) pixelsToCheck.push(x, y + 1);
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        function getPixelColor(data, x, y) {
            const i = (y * canvas.width + x) * 4;
            return { r: data[i], g: data[i + 1], b: data[i + 2], a: data[i + 3] };
        }

        function colorsMatch(c1, c2) {
            const threshold = 15;
            return Math.abs(c1.r - c2.r) < threshold && 
                   Math.abs(c1.g - c2.g) < threshold && 
                   Math.abs(c1.b - c2.b) < threshold;
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        // Geçmiş Yönetimi
        function saveState() {
            state.undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            if (state.undoStack.length > state.historyLimit) state.undoStack.shift();
            state.redoStack = [];
        }

        function undo() {
            if (state.undoStack.length > 1) {
                state.redoStack.push(state.undoStack.pop());
                const img = state.undoStack[state.undoStack.length - 1];
                ctx.putImageData(img, 0, 0);
            }
        }

        function redo() {
            if (state.redoStack.length > 0) {
                const img = state.redoStack.pop();
                state.undoStack.push(img);
                ctx.putImageData(img, 0, 0);
            }
        }

        function clearCanvasPrompt() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            saveState();
        }

        // Sayfa Kontrolleri
        function showDrawingPage() {
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('drawing-page').classList.remove('hidden');
            document.getElementById('drawing-page').classList.add('flex');
            setTimeout(resizeCanvas, 100);
        }

        function showHomePage() {
            document.getElementById('drawing-page').classList.remove('flex');
            document.getElementById('drawing-page').classList.add('hidden');
            document.getElementById('home-page').classList.remove('hidden');
        }

        // Yapay Zeka Entegrasyonu (Exponential Backoff ile)
        async function fetchWithRetry(url, options, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error('API Error');
                    return await response.json();
                } catch (err) {
                    if (i === maxRetries - 1) throw err;
                    await new Promise(resolve => setTimeout(resolve, Math.pow(2, i) * 1000));
                }
            }
        }

        async function transformWithAI() {
            const overlay = document.getElementById('ai-overlay');
            const progress = document.getElementById('ai-progress');
            const status = document.getElementById('ai-status');
            const subtext = document.getElementById('ai-subtext');
            
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            progress.style.width = '10%';
            
            try {
                const imageData = canvas.toDataURL('image/png').split(',')[1];

                // 1. ADIM: Tahmin (Gemini Vision)
                status.innerText = "RO-Bi inceliyor...";
                const visionUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                
                const visionResult = await fetchWithRetry(visionUrl, {
                    method: 'POST',
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Bu basit çizimde ne olduğunu tek kelimeyle tahmin et (Türkçe)." },
                                { inlineData: { mimeType: "image/png", data: imageData } }
                            ]
                        }]
                    })
                });

                const guess = visionResult.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "bir şey";
                progress.style.width = '40%';
                status.innerText = `Harika bir ${guess}!`;
                subtext.innerText = "Şimdi bunu 3D ve sevimli bir hale getiriyorum...";

                // 2. ADIM: Dönüştürme (Gemini Image Generation)
                const genUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=${apiKey}`;
                
                const genResult = await fetchWithRetry(genUrl, {
                    method: 'POST',
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: `Bu bir ${guess}. Bu taslağı al ve onu Pixar tarzında, çok sevimli, 3D render edilmiş, parlak büyük gözlü bir karaktere dönüştür. Arka plan düz beyaz olsun.` },
                                { inlineData: { mimeType: "image/png", data: imageData } }
                            ]
                        }],
                        generationConfig: { responseModalities: ['IMAGE'] }
                    })
                });

                const base64Img = genResult.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                
                if (base64Img) {
                    progress.style.width = '100%';
                    const img = new Image();
                    img.onload = () => {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        
                        const scale = Math.min(canvas.width / img.width, canvas.height / img.height) * 0.9;
                        const x = (canvas.width - img.width * scale) / 2;
                        const y = (canvas.height - img.height * scale) / 2;
                        
                        ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
                        saveState();
                        setTimeout(() => overlay.classList.add('hidden'), 500);
                    };
                    img.src = `data:image/png;base64,${base64Img}`;
                } else {
                    throw new Error("Görsel oluşturulamadı");
                }

            } catch (err) {
                status.innerText = "Bir hata oluştu!";
                subtext.innerText = "Bağlantını kontrol edip tekrar deneyebilir misin?";
                setTimeout(() => overlay.classList.add('hidden'), 3000);
            }
        }

        // Şablonlar
        function applyTemplate(type) {
            if (!type) return;
            clearCanvasPrompt();
            const s = Math.min(canvas.width, canvas.height) * 0.4;
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            ctx.save();
            ctx.translate(cx, cy);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();

            if (type === 'rabbit') {
                ctx.arc(0, 0, s*0.4, 0, Math.PI*2); // Kafa
                ctx.ellipse(-s*0.15, -s*0.5, s*0.1, s*0.3, -0.2, 0, Math.PI*2); // Kulaklar
                ctx.ellipse(s*0.15, -s*0.5, s*0.1, s*0.3, 0.2, 0, Math.PI*2);
            } else if (type === 'robot') {
                ctx.rect(-s*0.3, -s*0.3, s*0.6, s*0.5); // Kafa
                ctx.rect(-s*0.2, -s*0.1, s*0.1, s*0.1); // Gözler
                ctx.rect(s*0.1, -s*0.1, s*0.1, s*0.1);
            } else if (type === 'fish') {
                ctx.ellipse(0, 0, s*0.4, s*0.25, 0, 0, Math.PI*2);
                ctx.moveTo(-s*0.4, 0); ctx.lineTo(-s*0.6, -s*0.2); ctx.lineTo(-s*0.6, s*0.2); ctx.closePath();
            } else if (type === 'flower') {
                for(let i=0; i<8; i++) {
                    ctx.rotate(Math.PI/4);
                    ctx.ellipse(0, -s*0.25, s*0.1, s*0.2, 0, 0, Math.PI*2);
                }
                ctx.moveTo(s*0.1, 0); ctx.arc(0, 0, s*0.1, 0, Math.PI*2);
            } else if (type === 'rocket') {
                ctx.ellipse(0, 0, s*0.2, s*0.5, 0, 0, Math.PI*2);
                ctx.moveTo(-s*0.15, s*0.2); ctx.lineTo(-s*0.3, s*0.4); ctx.lineTo(-s*0.15, s*0.4);
                ctx.moveTo(s*0.15, s*0.2); ctx.lineTo(s*0.3, s*0.4); ctx.lineTo(s*0.15, s*0.4);
            }

            ctx.stroke();
            ctx.restore();
            saveState();
            document.getElementById('template-select').value = "";
        }

        function downloadCanvas() {
            const link = document.createElement('a');
            link.download = `bilfen-cizim-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        window.onload = init;
    </script>
</body>
</html>
